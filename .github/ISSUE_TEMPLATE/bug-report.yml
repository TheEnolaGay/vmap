name: Bug report
description: Report a defect in vmap
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Include failing checks, screenshots, or logs.
